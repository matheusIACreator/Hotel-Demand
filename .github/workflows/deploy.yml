name: Deploy Azure

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-dev-deploy
  cancel-in-progress: false

jobs:
  checks:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: azure-dev
    permissions:
      contents: read
      id-token: write
    env:
      MLFLOW_TRACKING_URI: ${{ vars.MLFLOW_TRACKING_URI }}
      MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
      MLFLOW_TRACKING_TOKEN: ${{ secrets.MLFLOW_TRACKING_TOKEN }}
      MODEL_NAME: ${{ vars.MODEL_NAME || 'hotel-cancellation' }}
      ACR_NAME: ${{ vars.ACR_NAME }}
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      APP_NAME: ${{ vars.AZURE_APP_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Verificar configuração
        run: |
          test -n "$MLFLOW_TRACKING_URI"
          test -n "$ACR_NAME"
          test -n "$RESOURCE_GROUP"
          test -n "$APP_NAME"
          case "$MLFLOW_TRACKING_URI" in
            https://*) ;;
            *) echo 'CD requer registry MLflow remoto por HTTPS'; exit 1 ;;
          esac

      - run: |
          pip install -r requirements.lock
          pip install --no-deps .

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Exportar champion aprovado
        run: hotelml export --output model-bundle

      - name: Construir, verificar e publicar imagem
        id: image
        run: |
          az acr login --name "$ACR_NAME"
          SERVER=$(az acr show --name "$ACR_NAME" --query loginServer -o tsv)
          TAG="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          IMAGE="$SERVER/hotelml:$TAG"
          docker build -t "$IMAGE" .
          docker run -d --name hotelml-candidate -p 8000:8000 "$IMAGE"
          VERSION=$(python -c "import json; print(json.load(open('model-bundle/manifest.json'))['model_version'])")
          python scripts/smoke_api.py http://127.0.0.1:8000 --version "$VERSION"
          docker push "$IMAGE"
          DIGEST=$(az acr repository show --name "$ACR_NAME" --image "hotelml:$TAG" --query digest -o tsv)
          echo "uri=$SERVER/hotelml@$DIGEST" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publicar revisão e validar endpoint
        env:
          IMAGE: ${{ steps.image.outputs.uri }}
          VERSION: ${{ steps.image.outputs.version }}
        run: |
          az containerapp update --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" --image "$IMAGE"
          FQDN=$(az containerapp show --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv)
          python scripts/smoke_api.py "https://$FQDN" --version "$VERSION"
          echo "Modelo: $VERSION | Imagem: $IMAGE" >> "$GITHUB_STEP_SUMMARY"

      - name: Logs do candidato
        if: always()
        run: docker logs hotelml-candidate || true
