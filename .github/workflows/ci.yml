name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Instalar dependências
        run: |
          pip install -r requirements-dev.lock
          pip install --no-deps -e .

      - name: Lint (ruff)
        run: ruff check src tests scripts

      - name: Formatação (ruff format)
        run: ruff format --check src tests scripts

      - name: Tipos (mypy)
        run: mypy src

      - name: Testes
        run: pytest --cov=hotelml --cov-report=term-missing --cov-fail-under=80

      - name: Exportar modelo de demonstração
        run: |
          hotelml train --source synthetic --rows 3000
          hotelml export --output model-bundle

      - name: Construir e testar container
        run: |
          docker build -t hotelml:ci .
          docker run -d --name hotelml-ci -p 8000:8000 hotelml:ci
          VERSION=$(python -c "import json; print(json.load(open('model-bundle/manifest.json'))['model_version'])")
          python scripts/smoke_api.py http://127.0.0.1:8000 --version "$VERSION"
          docker stop hotelml-ci

      - name: Construir ambiente de integração Spark
        run: docker build -f pipelines/Dockerfile --target test --build-arg HOTELML_IMAGE=hotelml:ci -t hotelml:spark-test .

      - name: Validar features e scoring distribuídos
        run: docker run --rm -v "$PWD/tests:/tests:ro" hotelml:spark-test -c /app/pyproject.toml /tests/test_spark.py -o cache_dir=/tmp/pytest-cache

      - name: Logs do container
        if: always()
        run: docker logs hotelml-ci || true

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Testes end-to-end e acessibilidade (axe)
        run: npm run test:e2e

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.5"
      - run: terraform fmt -check -recursive infra
      - run: terraform -chdir=infra init -backend=false
      - run: terraform -chdir=infra validate
